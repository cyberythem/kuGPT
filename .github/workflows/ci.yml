name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test local correction engine
        shell: powershell
        run: .\build.ps1 -Test
      - name: Run diagnostics
        run: python kugpt_launcher.py doctor

